<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c35">
  <title>Page not found — WayFind</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    main{max-width:520px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,6vw,48px)}
    h1{font-size:clamp(32px,8vw,54px);margin:10px 0}
    p{color:var(--muted)}
    a{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:12px;background:var(--accent);color:#092033;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">404 · Wrong turn</div>
    <h1>We can't find that page.</h1>
    <p>The place you're looking for may have moved. Head back to WayFind and start a new journey.</p>
    <a href="./index.html">Back to WayFind</a>
  </main>
</body>
</html>
